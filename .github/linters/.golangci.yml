# GolangCI-Lint configuration for LeafLock backend
# Centralized under .github/linters for CI reuse

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error

name: Frontend Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright:
    name: Run Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: leaflock_ci
      POSTGRES_PASSWORD: leaflock_ci_password_2024
      POSTGRES_DB: leaflock_ci
      JWT_SECRET: CI_Jwt_secret_for_playwright_tests_1234567890
      SERVER_ENCRYPTION_KEY: CI_Encryption_key_for_playwright_tests_123456
      DEFAULT_ADMIN_PASSWORD: LeafLockAdmin#2024
      DEFAULT_ADMIN_EMAIL: admin+ci@leaflock.app
      ENABLE_DEFAULT_ADMIN: "true"
      ENABLE_REGISTRATION: "true"
      SKIP_ADMIN_VALIDATION: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VITE_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start services with Docker Compose
        run: docker compose up -d --wait
        env:
          FRONTEND_PORT: 3000
          VITE_API_URL: http://localhost:8080
          BACKEND_INTERNAL_URL: http://backend:8080

      - name: Run Playwright tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
        run: pnpm exec playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: playwright
    timeout-minutes: 30
    env:
      POSTGRES_USER: leaflock_ci
      POSTGRES_PASSWORD: leaflock_ci_password_2024
      POSTGRES_DB: leaflock_ci
      JWT_SECRET: CI_Jwt_secret_for_lighthouse_tests_1234567890
      SERVER_ENCRYPTION_KEY: CI_Encryption_key_for_lighthouse_tests_12345
      DEFAULT_ADMIN_PASSWORD: LeafLockAdmin#2024
      DEFAULT_ADMIN_EMAIL: admin+lighthouse@leaflock.app
      ENABLE_DEFAULT_ADMIN: "true"
      ENABLE_REGISTRATION: "true"
      SKIP_ADMIN_VALIDATION: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VITE_API_URL: http://localhost:8080
      VITE_ENABLE_ADMIN_PANEL: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for Lighthouse
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start services with Docker Compose
        run: docker compose up -d --wait
        env:
          FRONTEND_PORT: 3000
          VITE_API_URL: http://localhost:8080
          BACKEND_INTERNAL_URL: http://backend:8080

      - name: Run Lighthouse CI
        working-directory: frontend
        run: pnpm run lhci -- --config=lighthouserc.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v

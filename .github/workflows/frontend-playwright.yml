name: Frontend Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright:
    name: Run Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: pnpm exec playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: playwright
    timeout-minutes: 30
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: leaflock
      DATABASE_URL: postgres://postgres:testpass123@localhost:5432/leaflock?sslmode=disable
      REDIS_URL: localhost:6379
      JWT_SECRET: test_jwt_secret_for_ci_only_not_for_production_use_12345678
      SERVER_ENCRYPTION_KEY: test_encryption_key_32_chars_ok_1234
      CORS_ORIGINS: http://localhost:3000
      VITE_API_URL: http://localhost:8080
      VITE_ENABLE_ADMIN_PANEL: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Setup Redis
        uses: redis-actions/setup-redis@v1
        with:
          redis-version: '7'

      - name: Setup PostgreSQL
        uses: postgresql-actions/setup-postgresql@v1
        with:
          postgresql-version: '16'
          postgresql-db: ${{ env.POSTGRES_DB }}
          postgresql-user: ${{ env.POSTGRES_USER }}
          postgresql-password: ${{ env.POSTGRES_PASSWORD }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for services
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U "${POSTGRES_USER}"; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            if timeout 2 bash -c "</dev/tcp/localhost/6379"; then
              echo "Redis is ready!"
              break
            fi
            echo "Redis is unavailable - sleeping"
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: go mod download

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          PORT: 8080
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SERVER_ENCRYPTION_KEY: ${{ env.SERVER_ENCRYPTION_KEY }}
          CORS_ORIGINS: ${{ env.CORS_ORIGINS }}
        run: |
          go build -o app .
          ./app &
          echo $! > backend.pid

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_ENABLE_ADMIN_PANEL: ${{ env.VITE_ENABLE_ADMIN_PANEL }}
        run: |
          pnpm run preview --port 3000 --host 0.0.0.0 &
          echo $! > frontend.pid

      - name: Wait for application readiness
        run: |
          echo "Waiting for backend..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            echo "Backend not ready, attempt $i/60..."
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
            if [ "$code" = "200" ]; then
              echo "Frontend ready"
              break
            fi
            echo "Frontend not ready (code: $code), attempt $i/60..."
            sleep 2
          done

      - name: Install Playwright Chromium for Lighthouse
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve Chromium path
        id: chromium
        working-directory: frontend
        run: |
          CHROMIUM_PATH=$(node --input-type=module -e "import('playwright-core').then(m => console.log(m.chromium.executablePath()))")
          echo "executable=$CHROMIUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.chromium.outputs.executable }}
          LHCI_CHROME_PATH: ${{ steps.chromium.outputs.executable }}
        run: pnpm run lhci -- --config=lighthouserc.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

      - name: Cleanup processes
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi
          pkill -f "./app" || true
          pkill -f "vite preview" || true

# Frontend linting suite (ESLint, Prettier, types)
# Separate from MegaLinter due to ESLint 9 flat config requirements
name: CI - Frontend Quality

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**/*.{js,jsx,ts,tsx}'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/eslint.config.js'
      - 'frontend/.prettierrc'
      - '.github/workflows/ci-frontend-quality.yml'
  pull_request:
    paths:
      - 'frontend/**/*.{js,jsx,ts,tsx}'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/eslint.config.js'
      - 'frontend/.prettierrc'
      - '.github/workflows/ci-frontend-quality.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: 🎨 Lint Frontend Code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: 🔧 Enable pnpm
        run: |
          corepack enable
          PNPM_VERSION=$(jq -r '.packageManager' frontend/package.json)
          corepack prepare "$PNPM_VERSION" --activate

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 📦 Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        working-directory: frontend
        run: pnpm run lint

      - name: 🎨 Check Prettier formatting
        working-directory: frontend
        run: pnpm run format:check

      - name: 🔧 Run TypeScript type check
        working-directory: frontend
        run: pnpm run typecheck

      - name: 📊 Report Results
        if: always()
        run: |
          echo "✅ Frontend linting completed"
          echo "ESLint version: 9.36.0"
          echo "Node.js version: 22"
          echo "Configuration: frontend/eslint.config.js"

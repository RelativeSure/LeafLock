name: CI - Frontend Lighthouse

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Run Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Wait for Railway to deploy
        run: |
          echo "⏳ Waiting for Railway to auto-deploy commit ${{ github.sha }}..."
          echo "Railway deploys on every push automatically."
          echo "Sleeping 3 minutes to allow deployment to complete..."
          sleep 180

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "❌ Chrome not found"
            exit 1
          fi
          echo "✅ Using Chrome: $CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Run Lighthouse CI on Railway deployment
        working-directory: frontend
        env:
          DEPLOYMENT_URL: ${{ secrets.RAILWAY_FRONTEND_URL }}
        run: |
          echo "🔍 Running Lighthouse on Railway URL: $DEPLOYMENT_URL"
          pnpm run lhci -- --config=lighthouserc.json --url="$DEPLOYMENT_URL"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

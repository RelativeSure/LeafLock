# Go linting with golangci-lint
# Runs golangci-lint on the backend directory
# Separate from MegaLinter due to Go version requirements (1.25+)
name: CI - Backend Lint

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**/*.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - '.github/linters/.golangci.yml'
      - '.github/workflows/ci-backend-lint.yml'
  pull_request:
    paths:
      - 'backend/**/*.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - '.github/linters/.golangci.yml'
      - '.github/workflows/ci-backend-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: 🔍 Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: 🔧 Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: 🔍 Run golangci-lint
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9
        with:
          version: latest
          working-directory: backend
          args: --config ../.github/linters/.golangci.yml --timeout 5m

      - name: 📊 Report Results
        if: always()
        run: |
          echo "✅ Go linting completed"
          echo "Configuration: .github/linters/.golangci.yml"
          echo "Go version: 1.25"

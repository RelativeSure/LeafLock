name: CI - Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Wait for Railway to deploy
        run: |
          echo "⏳ Waiting for Railway to auto-deploy commit ${{ github.sha }}..."
          echo "Railway deploys on every push automatically."
          echo "Sleeping 3 minutes to allow deployment to complete..."
          sleep 180

      - name: Get Railway backend URL
        id: backend-url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "🔍 Fetching backend deployment URL from Railway GraphQL API..."
          echo "Commit SHA: ${{ github.sha }}"

          # Query all recent deployments for this project and filter by commit
          QUERY='{"query":"query { project(id: \"'$RAILWAY_PROJECT_ID'\") { deployments(first: 20) { edges { node { id staticUrl status meta createdAt environment { name } service { name } } } } } }"}'

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          echo "Response: $RESPONSE"

          # Filter for backend service with matching commit SHA and SUCCESS status
          BACKEND_URL=$(echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | select(.node.service.name == "backend") | select(.node.status == "SUCCESS" or .node.status == "ACTIVE") | select(.node.meta != null) | .node.staticUrl' | head -n 1)

          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
            echo "⚠️ Could not find deployment by commit SHA, trying latest successful deployment..."
            BACKEND_URL=$(echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | select(.node.service.name == "backend") | select(.node.status == "SUCCESS" or .node.status == "ACTIVE") | .node.staticUrl' | head -n 1)
          fi

          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
            echo "❌ Failed to get backend URL from Railway"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          echo "BACKEND_URL=https://$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Backend URL: https://$BACKEND_URL"

      - name: Test Railway backend deployment
        env:
          BACKEND_URL: ${{ steps.backend-url.outputs.BACKEND_URL }}
        run: |
          echo "🧪 Testing Railway backend at: $BACKEND_URL"

          # Poll backend health endpoint (up to 5 minutes)
          for i in {1..60}; do
            if curl -f -s "$BACKEND_URL/api/v1/health/live" > /dev/null 2>&1; then
              echo "✅ Backend is responding!"
              curl -f -v "$BACKEND_URL/api/v1/health/ready" || exit 1
              echo "✅ All backend health checks passed!"
              exit 0
            fi
            echo "⏳ Backend not ready yet... ($i/60)"
            sleep 5
          done
          echo "❌ Backend failed to respond after 5 minutes"
          exit 1

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Wait for Railway to deploy
        run: |
          echo "⏳ Waiting for Railway to auto-deploy commit ${{ github.sha }}..."
          echo "Railway deploys on every push automatically."
          echo "Sleeping 3 minutes to allow deployment to complete..."
          sleep 180

      - name: Get Railway frontend URL
        id: frontend-url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "🔍 Fetching frontend deployment URL from Railway GraphQL API..."
          echo "Commit SHA: ${{ github.sha }}"

          # Query all recent deployments for this project and filter by commit
          QUERY='{"query":"query { project(id: \"'$RAILWAY_PROJECT_ID'\") { deployments(first: 20) { edges { node { id staticUrl status meta createdAt environment { name } service { name } } } } } }"}'

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          echo "Response: $RESPONSE"

          # Filter for frontend service with matching commit SHA and SUCCESS status
          FRONTEND_URL=$(echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | select(.node.service.name == "frontend") | select(.node.status == "SUCCESS" or .node.status == "ACTIVE") | select(.node.meta != null) | .node.staticUrl' | head -n 1)

          if [ -z "$FRONTEND_URL" ] || [ "$FRONTEND_URL" = "null" ]; then
            echo "⚠️ Could not find deployment by commit SHA, trying latest successful deployment..."
            FRONTEND_URL=$(echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | select(.node.service.name == "frontend") | select(.node.status == "SUCCESS" or .node.status == "ACTIVE") | .node.staticUrl' | head -n 1)
          fi

          if [ -z "$FRONTEND_URL" ] || [ "$FRONTEND_URL" = "null" ]; then
            echo "❌ Failed to get frontend URL from Railway"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          echo "FRONTEND_URL=https://$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Frontend URL: https://$FRONTEND_URL"

      - name: Test Railway frontend deployment
        env:
          FRONTEND_URL: ${{ steps.frontend-url.outputs.FRONTEND_URL }}
        run: |
          echo "🧪 Testing Railway frontend at: $FRONTEND_URL"

          # Poll frontend health endpoint (up to 5 minutes)
          for i in {1..60}; do
            if curl -f -s "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "✅ Frontend is responding!"
              echo "✅ All frontend health checks passed!"
              exit 0
            fi
            echo "⏳ Frontend not ready yet... ($i/60)"
            sleep 5
          done
          echo "❌ Frontend failed to respond after 5 minutes"
          exit 1

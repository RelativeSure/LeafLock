name: CI - Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Wait for Railway to deploy
        run: |
          echo "⏳ Waiting for Railway to auto-deploy commit ${{ github.sha }}..."
          echo "Railway deploys on every push automatically."
          echo "Sleeping 3 minutes to allow deployment to complete..."
          sleep 180

      - name: Verify Railway secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_ACCOUNT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "🔍 Verifying Railway configuration..."

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN_ACCOUNT secret is not set!"
            echo "Go to Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: RAILWAY_TOKEN_ACCOUNT"
            echo "Value: Your Railway account token from railway.app/account/tokens"
            exit 1
          fi

          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "❌ RAILWAY_PROJECT_ID secret is not set!"
            echo "Go to Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: RAILWAY_PROJECT_ID"
            echo "Value: Your Railway project ID (from project settings or URL)"
            exit 1
          fi

          echo "✅ Railway secrets are configured"
          echo "Project ID: ${RAILWAY_PROJECT_ID:0:8}..." # Show first 8 chars only

      - name: List accessible projects
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_ACCOUNT }}
        run: |
          echo "🔍 Listing projects accessible to this token..."
          QUERY='{"query":"query { me { projects { edges { node { id name } } } } }"}'

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          echo "Raw API Response:"
          echo "$RESPONSE" | jq '.'

          # Check for authentication errors
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo ""
            echo "❌ Authentication failed - token may be invalid or expired"
            echo "Errors: $(echo "$RESPONSE" | jq '.errors')"
            exit 1
          fi

          echo ""
          echo "Projects accessible to this token:"
          echo "$RESPONSE" | jq -r '.data.me.projects.edges[].node | "  - \(.name) (\(.id))"' || echo "  (none found or failed to parse)"

      - name: Get Railway backend URL
        id: backend-url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_ACCOUNT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "🔍 Fetching backend deployment URL from Railway GraphQL API..."
          echo "Commit SHA: ${{ github.sha }}"

          # Query all recent deployments for this project
          QUERY='{"query":"query { project(id: \"'$RAILWAY_PROJECT_ID'\") { deployments(first: 20) { edges { node { id staticUrl status meta createdAt environment { name } service { name } } } } } }"}'

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          # Check for errors
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "❌ Railway API error:"
            echo "$RESPONSE" | jq '.errors'
            echo ""
            echo "Troubleshooting:"
            echo "1. Verify RAILWAY_PROJECT_ID is correct (check Railway project settings)"
            echo "2. Verify RAILWAY_TOKEN has access to this project"
            echo "3. Check that the token hasn't expired"
            exit 1
          fi

          # Filter for backend service with SUCCESS or ACTIVE status
          BACKEND_URL=$(echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | select(.node.service.name == "backend") | select(.node.status == "SUCCESS" or .node.status == "ACTIVE") | .node.staticUrl' | head -n 1)

          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
            echo "❌ Failed to get backend URL from Railway"
            echo "Available deployments:"
            echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | "\(.node.service.name): \(.node.status) - \(.node.staticUrl // "no URL")"'
            exit 1
          fi

          echo "BACKEND_URL=https://$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Backend URL: https://$BACKEND_URL"

      - name: Test Railway backend deployment
        env:
          BACKEND_URL: ${{ steps.backend-url.outputs.BACKEND_URL }}
        run: |
          echo "🧪 Testing Railway backend at: $BACKEND_URL"

          # Poll backend health endpoint (up to 5 minutes)
          for i in {1..60}; do
            if curl -f -s "$BACKEND_URL/api/v1/health/live" > /dev/null 2>&1; then
              echo "✅ Backend is responding!"
              curl -f -v "$BACKEND_URL/api/v1/health/ready" || exit 1
              echo "✅ All backend health checks passed!"
              exit 0
            fi
            echo "⏳ Backend not ready yet... ($i/60)"
            sleep 5
          done
          echo "❌ Backend failed to respond after 5 minutes"
          exit 1

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Wait for Railway to deploy
        run: |
          echo "⏳ Waiting for Railway to auto-deploy commit ${{ github.sha }}..."
          echo "Railway deploys on every push automatically."
          echo "Sleeping 3 minutes to allow deployment to complete..."
          sleep 180

      - name: Verify Railway secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_ACCOUNT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "🔍 Verifying Railway configuration..."

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN_ACCOUNT secret is not set!"
            exit 1
          fi

          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "❌ RAILWAY_PROJECT_ID secret is not set!"
            exit 1
          fi

          echo "✅ Railway secrets are configured"

      - name: List accessible projects
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_ACCOUNT }}
        run: |
          echo "🔍 Listing projects accessible to this token..."
          QUERY='{"query":"query { me { projects { edges { node { id name } } } } }"}'

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          echo "Raw API Response:"
          echo "$RESPONSE" | jq '.'

          # Check for authentication errors
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo ""
            echo "❌ Authentication failed - token may be invalid or expired"
            echo "Errors: $(echo "$RESPONSE" | jq '.errors')"
            exit 1
          fi

          echo ""
          echo "Projects accessible to this token:"
          echo "$RESPONSE" | jq -r '.data.me.projects.edges[].node | "  - \(.name) (\(.id))"' || echo "  (none found or failed to parse)"

      - name: Get Railway frontend URL
        id: frontend-url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_ACCOUNT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "🔍 Fetching frontend deployment URL from Railway GraphQL API..."
          echo "Commit SHA: ${{ github.sha }}"

          # Query all recent deployments for this project
          QUERY='{"query":"query { project(id: \"'$RAILWAY_PROJECT_ID'\") { deployments(first: 20) { edges { node { id staticUrl status meta createdAt environment { name } service { name } } } } } }"}'

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          # Check for errors
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "❌ Railway API error:"
            echo "$RESPONSE" | jq '.errors'
            echo ""
            echo "Troubleshooting:"
            echo "1. Verify RAILWAY_PROJECT_ID is correct (check Railway project settings)"
            echo "2. Verify RAILWAY_TOKEN has access to this project"
            echo "3. Check that the token hasn't expired"
            exit 1
          fi

          # Filter for frontend service with SUCCESS or ACTIVE status
          FRONTEND_URL=$(echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | select(.node.service.name == "frontend") | select(.node.status == "SUCCESS" or .node.status == "ACTIVE") | .node.staticUrl' | head -n 1)

          if [ -z "$FRONTEND_URL" ] || [ "$FRONTEND_URL" = "null" ]; then
            echo "❌ Failed to get frontend URL from Railway"
            echo "Available deployments:"
            echo "$RESPONSE" | jq -r '.data.project.deployments.edges[] | "\(.node.service.name): \(.node.status) - \(.node.staticUrl // "no URL")"'
            exit 1
          fi

          echo "FRONTEND_URL=https://$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Frontend URL: https://$FRONTEND_URL"

      - name: Test Railway frontend deployment
        env:
          FRONTEND_URL: ${{ steps.frontend-url.outputs.FRONTEND_URL }}
        run: |
          echo "🧪 Testing Railway frontend at: $FRONTEND_URL"

          # Poll frontend health endpoint (up to 5 minutes)
          for i in {1..60}; do
            if curl -f -s "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "✅ Frontend is responding!"
              echo "✅ All frontend health checks passed!"
              exit 0
            fi
            echo "⏳ Frontend not ready yet... ($i/60)"
            sleep 5
          done
          echo "❌ Frontend failed to respond after 5 minutes"
          exit 1

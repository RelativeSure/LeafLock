# Codecov Configuration for LeafLock
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# Coverage targets and enforcement
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 50%
        threshold: 2%
        if_ci_failed: error
        informational: false

      backend:
        target: 50%
        threshold: 2%
        flags:
          - backend
        paths:
          - backend/
        if_ci_failed: error

      frontend:
        target: 80%
        threshold: 1%
        flags:
          - frontend
        paths:
          - frontend/src/
        if_ci_failed: error

    patch:
      default:
        target: 75%
        threshold: 2%
        if_ci_failed: error

    changes:
      default:
        if_ci_failed: error

# Flags for separating frontend/backend coverage
flags:
  backend:
    paths:
      - backend/
    carryforward: false

  frontend:
    paths:
      - frontend/src/
    carryforward: false

# Ignore paths that shouldn't affect coverage
ignore:
  - "**/*_test.go"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test-setup.ts"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/*.config.ts"
  - "**/*.config.js"
  - "**/vite.config.*"
  - "**/vitest.config.*"
  - "**/playwright.config.*"
  - "frontend/src/vite-env.d.ts"
  - "backend/main.go"
  - "backend/cmd/**"
  - "docs/**"
  - "scripts/**"
  - ".github/**"
  - "helm/**"
  - "k8s/**"

# Comment configuration for PR comments
comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

  # Show these sections in PR comments
  branches: null

  # Hide complexity metrics (keep focused on coverage)
  hide_project_coverage: false

# GitHub Checks integration
github_checks:
  annotations: true

# Codecov AI suggestions (optional)
cli:
  runners:
    retry_count: 3
    retry_delay: 5
